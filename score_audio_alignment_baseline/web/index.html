<!doctype html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Score Sync Demo</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">
      <div class="topbar">
        <header class="page-header panel">
          <h1>Synchronizácia partitúry s nahrávkou</h1>
        </header>

        <section class="panel controls" aria-label="Ovládanie prehrávania">
          <label for="songSelect" class="controls__label">Skladba:</label>
          <select id="songSelect">
            <option value="aka-si-mi-krasna">Aká si mi krásna</option>
            <option value="chopin">Chopin</option>
          </select>
          <button id="loadBtn" type="button">Načítať vybranú skladbu</button>
          <button id="playBtn" type="button">Play</button>
          <button id="pauseBtn" type="button">Pause</button>
          <button id="stopBtn" type="button">Stop</button>
        </section>

        <section class="panel status" aria-label="Stav synchronizácie">
          <p>
            <strong>Aktuálna skladba:</strong> <span id="currentSong">-</span>
          </p>
          <p><strong>Audio time:</strong> <span id="audioTime">0.00</span> s</p>
          <p>
            <strong>Score time:</strong> <span id="scoreTime">0.00</span> beats
          </p>
        </section>

        <section class="panel audio-panel" aria-label="Prehrávač zvuku">
          <audio id="audio" controls>
            Tvoj prehliadač nepodporuje audio element.
          </audio>
        </section>
      </div>

      <section
        id="score"
        class="panel score-panel"
        aria-label="Notový zápis"
      ></section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/opensheetmusicdisplay@1.8.9/build/opensheetmusicdisplay.min.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
